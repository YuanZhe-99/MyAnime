name: my_anime
description: "MyAnime!!!!! — Your anime tracking companion"
publish_to: 'none'

version: 1.8.12+85

dependency_overrides:
  # Xcode 26.6 protocol availability fix; upstream PR #2870, macOS only.
  flutter_inappwebview_macos:
    path: packages/flutter_inappwebview_macos
  # Upstream 1.0.11 bundles x64 only; the local patch keeps ARM64 on WebView.
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video

environment:
  sdk: ^3.11.3

dependencies:
  myapps_ai_ui:
    path: packages/myapps_ai/packages/myapps_ai_ui
  myapps_ai:
    path: packages/myapps_ai/packages/myapps_ai
  myapps_ai_platform:
    path: packages/myapps_ai/packages/myapps_ai_platform
  myapps_ai_llm:
    path: packages/myapps_ai/packages/myapps_ai_llm
  myapps_ai_llm_llama:
    path: packages/myapps_ai/packages/myapps_ai_llm_llama
  myapps_ai_models:
    path: packages/myapps_ai/packages/myapps_ai_models
  myapps_ai_local_ui:
    path: packages/myapps_ai/packages/myapps_ai_local_ui
  myapps_ai_online:
    path: packages/myapps_ai/packages/myapps_ai_online
  myapps_ai_online_ui:
    path: packages/myapps_ai/packages/myapps_ai_online_ui
  myapps_profile:
    path: packages/myapps_ui/packages/myapps_profile
  # Shared theme and adaptive foundation, pinned by the MyApps-UI submodule.
  myapps_ui:
    path: packages/myapps_ui/packages/myapps_ui
  myapps_adaptive:
    path: packages/myapps_ui/packages/myapps_adaptive
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared WebDAV sync & data-management engines, embedded as a git submodule.
  # The submodule commit is the lockfile — pub does not lock path deps.
  # After a fresh clone: git submodule update --init
  myapps_data:
    path: packages/myapps_data
  # Local plugin: Apple Foundation Models bridge for on-device AI (iOS and
  # macOS only). See doc/en-us/on-device-ai.md.

  # State management
  flutter_riverpod: ^1.0.4

  # Navigation
  go_router: ^14.8.1

  # Theming
  dynamic_color: ^1.7.0

  # Icons
  cupertino_icons: ^1.0.8

  # i18n
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: 10.3.7
  package_info_plus: ^9.0.0
  device_preview: ^1.2.0
  wakelock_plus: ^1.5.2

  # HTTP (WebDAV sync)
  http: ^1.4.0
  html: ^0.15.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_inappwebview: 6.2.0-beta.3

  # Pure-Dart image codec: shrinks missing-sequel covers into the small
  # synced thumbnails in recommendations.json (1.6.3). Also used by tool/.
  image: ^4.8.0

  # Link type (wifi/cellular/ethernet) for the background metadata updater.
  # Reports the transport, NOT whether it is metered — see
  # doc/en-us/features/metadata-auto-update.md for what that does and does not
  # guarantee.
  connectivity_plus: ^6.1.0

  # Archive (ZIP export/import)
  archive: ^4.0.9

  # Calendar
  table_calendar: ^3.2.0

  # Charts
  fl_chart: ^1.2.0

  # URL launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0

  # Local notifications
  flutter_local_notifications: ^19.0.0
  local_notifier: ^0.1.6
  timezone: ^0.10.0

  # Local HTTP API server (desktop)
  shelf: ^1.4.0
  shelf_router: ^1.1.0

  # System tray & window management (desktop)
  tray_manager: ^0.2.3
  window_manager: ^0.4.3

  # Auto-start on boot (desktop)
  launch_at_startup: ^0.5.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # fakeAsync, for the on-device AI timeout test. Already resolved through
  # flutter_test; declared so the import is explicit.
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.8
  path_provider_platform_interface: ^2.1.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

msix_config:
  display_name: MyAnime!!!!!
  publisher_display_name: yuanzhe
  identity_name: com.yuanzhe.myanime
  msix_version: 1.8.11.0
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient
  install_certificate: false
