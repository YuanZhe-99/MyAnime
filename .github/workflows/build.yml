name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  # ── Android APK (full) + AAB (store) ──
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # myapps_data is a path dependency living in a submodule; without it
          # `flutter pub get` fails. The relative URL resolves to the public
          # GitHub copy here, so the default GITHUB_TOKEN suffices.
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Setup Android signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build APK (full)
        run: flutter build apk --release --dart-define=FLAVOR=full

      - name: Build AAB (store)
        run: flutter build appbundle --release --dart-define=FLAVOR=store

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-full
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab-store
          path: build/app/outputs/bundle/release/app-release.aab

  # ── Windows x64 installer (full) ──
  windows-x64:
    runs-on: windows-latest
    env:
      # VS/MSVC 18 promotes <experimental/coroutine> deprecation to a build error.
      # flutter_local_notifications_windows still reaches that header through winrt.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v7
        with:
          # myapps_data is a path dependency living in a submodule; without it
          # `flutter pub get` fails. The relative URL resolves to the public
          # GitHub copy here, so the default GITHUB_TOKEN suffices.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build Windows x64 (full)
        run: flutter build windows --release --dart-define=FLAVOR=full

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (x64)
        run: iscc installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-x64-full
          path: build/installer/*.exe

  # ── Windows ARM64 installer (full, Flutter stable cloned from git) ──
  windows-arm64:
    runs-on: windows-11-arm
    env:
      # Keep Windows builds aligned while plugin dependencies still use winrt headers
      # that include deprecated <experimental/coroutine> on newer MSVC toolchains.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v7
        with:
          # myapps_data is a path dependency living in a submodule; without it
          # `flutter pub get` fails. The relative URL resolves to the public
          # GitHub copy here, so the default GITHUB_TOKEN suffices.
          submodules: recursive

      # The published Windows archive is x64 and carries an x64 Dart, which makes
      # the tool build an x64 app. A git clone of the stable tag fetches the
      # engine halves matching this Arm machine (stable engines ship windows-arm64
      # artifacts), and a fixed tag keeps DLL hashes stable for Defender reputation.
      # Never clone master: its head can fail to build flutter_tools, and doctor
      # then retries forever.
      - name: Setup Flutter stable (git clone for the ARM64 engine)
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git `
            --branch $env:FLUTTER_VERSION --depth 1 `
            "$env:USERPROFILE\flutter"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\flutter\bin"

      - name: Flutter doctor
        timeout-minutes: 15
        run: flutter doctor

      - run: flutter pub get

      - name: Build Windows ARM64 (full)
        run: flutter build windows --release --dart-define=FLAVOR=full

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (ARM64)
        run: iscc /DARM64 installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-arm64-full
          path: build/installer/*.exe

  # ── iOS IPA (full sideload + store) ──
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # myapps_data is a path dependency living in a submodule; without it
          # `flutter pub get` fails. The relative URL resolves to the public
          # GitHub copy here, so the default GITHUB_TOKEN suffices.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build iOS (full, no codesign)
        run: flutter build ios --release --no-codesign --dart-define=FLAVOR=full

      # FoundationModels exists only on iOS 26+, and a strong link would stop
      # the app launching on iOS 18 and earlier. See doc/en-us/on-device-ai.md.
      - name: Check FoundationModels is weakly linked (iOS)
        run: bash tool/check_weak_link.sh build/ios/iphoneos/Runner.app

      - name: Package sideload IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r MyAnime_sideload.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-full-sideload
          path: build/ios/ipa/MyAnime_sideload.ipa

  # ── macOS DMG (full) ──
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # myapps_data is a path dependency living in a submodule; without it
          # `flutter pub get` fails. The relative URL resolves to the public
          # GitHub copy here, so the default GITHUB_TOKEN suffices.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Add macOS platform if missing
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos .
          fi

      - name: Build macOS (full)
        run: flutter build macos --release --dart-define=FLAVOR=full

      # Same check as iOS, for macOS 15 and earlier. The bundle name contains
      # `!!!!!`, so it is found rather than typed, and always quoted.
      - name: Check FoundationModels is weakly linked (macOS)
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          bash tool/check_weak_link.sh "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          create-dmg \
            --volname "MyAnime!!!!!" \
            --app-drop-link 400 150 \
            "build/macos/MyAnime.dmg" \
            "$APP_PATH" || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-full
          path: build/macos/MyAnime.dmg

  # ── Create GitHub Release on tag push ──
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows-x64, windows-arm64, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.exe" -o -name "*.ipa" -o -name "*.dmg" \) -exec cp {} release/ \;

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
